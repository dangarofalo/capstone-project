# Production deployment: PostgreSQL + SentinelView + Caddy (automatic HTTPS).
#
#   copy .env.example .env      (then fill in the values)
#   docker compose up -d --build
#
# The dashboard is then at https://<SENTINEL_DOMAIN>.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinelview
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelview"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinelview
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Not published to the host: only Caddy talks to it.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
